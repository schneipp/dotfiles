# Colours, regenerated by DankMaterialShell on every theme change.
# Top-level: foot splices an include in place, so it must sit before any
# section of ours. The installer creates the file — a dangling include is a
# hard error and foot will not start.
include=~/.config/foot/dank-colors.ini

[main]
term=xterm-256color
font=JetBrainsMono Nerd Font:size=10
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c
clipboard-paste=Shift+Insert Control+Shift+v
primary-paste=none

# Font size, matching the rest of anarchy.
font-increase=Control+Up Control+plus Control+equal Control+KP_Add
font-decrease=Control+Down Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
