# anarchy-rdp — one entry per remote monitor, left to right.
# Match your client's screens. Apply with: anarchy-rdp restart
MONITORS=(1920x1080 1920x1080)

# The first monitor listens on PORT, the next on PORT+1, and so on.
PORT=3389
BIND=0.0.0.0

# 2 for HiDPI clients (the output is then half as wide in layout space).
SCALE=1
REFRESH=60
