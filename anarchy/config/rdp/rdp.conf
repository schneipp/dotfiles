# anarchy-rdp. Apply changes with: anarchy-rdp restart

# dynamic: one screen that takes the client window's size and follows it
#          when the window is resized.
# fixed:   the MONITORS below, one port each, for a multi-monitor desk.
MODE=dynamic

# fixed mode only: one entry per remote monitor, left to right.
MONITORS=(1920x1080 1920x1080)

# The port of the (first) screen; fixed mode uses PORT+1, PORT+2 … as well.
# The installer picks one no other user on this machine has.
PORT=3389
BIND=0.0.0.0

# fixed mode: 2 for HiDPI clients (the output is then half as wide in layout space).
SCALE=1
REFRESH=60

# Disable screens plugged into the machine itself: windows opening on one are
# invisible to every client, and seatless sessions have no seat to share it.
HIDE_PHYSICAL=yes
